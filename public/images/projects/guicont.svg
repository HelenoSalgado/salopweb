<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#gcBg)"/>

  <!-- Header Badge -->
  <rect x="50" y="45" width="125" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="112" y="65" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">SAAS COMERCIAL</text>

  <text x="50" y="115" fill="#f8fafc" font-family="system-ui, serif" font-size="28" font-weight="700">Guia Cont — Emissor NF-e</text>
  <text x="50" y="142" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Gestão Fiscal Inteligente, Download em Lote de XMLs e Gateway de Faturamento</text>

  <!-- Dashboard Mockup Card -->
  <g transform="translate(50, 175)">
    <rect width="700" height="195" rx="10" fill="#0b1320" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Mini KPI Cards -->
    <rect x="25" y="25" width="200" height="70" rx="8" fill="#111c2e" stroke="#1e293b"/>
    <text x="45" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">XMLs Processados</text>
    <text x="45" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Download em Lote</text>

    <rect x="250" y="25" width="200" height="70" rx="8" fill="#111c2e" stroke="#1e293b"/>
    <text x="270" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Autenticação &amp; Segurança</text>
    <text x="270" y="78" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="700">JWT &amp; Multi-CNPJ</text>

    <rect x="475" y="25" width="200" height="70" rx="8" fill="#111c2e" stroke="#1e293b"/>
    <text x="495" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Faturamento Integrado</text>
    <text x="495" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Asaas Gateway</text>

    <!-- Table Header Mockup -->
    <rect x="25" y="115" width="650" height="32" rx="6" fill="#172338"/>
    <text x="45" y="136" fill="#cbd5e1" font-family="monospace" font-size="12">CNPJ / Empresa</text>
    <text x="250" y="136" fill="#cbd5e1" font-family="monospace" font-size="12">Status SEFAZ</text>
    <text x="450" y="136" fill="#cbd5e1" font-family="monospace" font-size="12">Formato</text>
    <text x="590" y="136" fill="#10b981" font-family="monospace" font-size="12">Ação</text>

    <line x1="25" y1="162" x2="675" y2="162" stroke="#1e293b"/>
    <text x="45" y="180" fill="#94a3b8" font-family="monospace" font-size="11">Empresas Cadastradas</text>
    <text x="250" y="180" fill="#10b981" font-family="monospace" font-size="11">● Sincronizado</text>
    <text x="450" y="180" fill="#94a3b8" font-family="monospace" font-size="11">XML + DANFE</text>
    <text x="590" y="180" fill="#38bdf8" font-family="monospace" font-size="11">Exportar .ZIP</text>
  </g>

  <!-- Badges at bottom -->
  <g transform="translate(50, 395)">
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#1e293b"/>
    <text x="50" y="17" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">PHP / Laravel</text>

    <rect x="110" y="0" width="85" height="26" rx="6" fill="#1e293b"/>
    <text x="152" y="17" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">JWT Auth</text>

    <rect x="205" y="0" width="105" height="26" rx="6" fill="#1e293b"/>
    <text x="257" y="17" fill="#10b981" font-family="monospace" font-size="12" text-anchor="middle">Asaas API</text>

    <rect x="320" y="0" width="95" height="26" rx="6" fill="#1e293b"/>
    <text x="367" y="17" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">Multi-Tenant</text>
  </g>
